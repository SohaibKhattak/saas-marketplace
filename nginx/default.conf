# 1. Routing Traffic for the Custom Node.js API Backend
server {
    listen 80;
    server_name api.saasifyy.tech;

    location / {
        proxy_pass http://saasifyy-api:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# 2. Main Multisite Network and Wildcard Subdomain Router (*.saasifyy.tech)
server {
    listen 80;
    server_name saasifyy.tech *.saasifyy.tech;
    root /var/www/html;
    index index.php index.html index.htm;

    # Fix: Explicit proxy headers so WordPress understands SSL encryption state
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https; # Tell WP it's secure inside

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # Pass all PHP execution directly to the dedicated WordPress container
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass saasifyy-wordpress:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires max;
        log_not_found off;
    }
}