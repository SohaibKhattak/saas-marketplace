# .github/workflows/deploy.yml
name: CD - Auto-Deploy to Azure VM Cluster

on:
  push:
    branches:
      - main # Triggers only when you push or merge a pull request into main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Execute Remote SSH Commands for Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST_IP }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          envs: API_ENV_FILE,FRONTEND_ENV_FILE
          script: |
            cd ~/saas-marketplace
            git reset --hard origin/main
            git pull origin main

            # Write .env safely from environment variable
            printf '%s' "$API_ENV_FILE" > ./apps/api/.env
            printf '%s' "$FRONTEND_ENV_FILE" > ./apps/web/.env


            # Verify it was written correctly
            echo ".env line count: $(wc -l < ./apps/api/.env)"

            docker compose up -d --build
            docker image prune -f

            # Deploy WordPress MU-plugins
            sudo mkdir -p /var/www/wordpress/wp-content/mu-plugins/
            sudo cp -r ./wordpress/mu-plugins/* /var/www/wordpress/wp-content/mu-plugins/
            sudo chown -R www-data:www-data /var/www/wordpress/wp-content/mu-plugins/
        env:
          API_ENV_FILE: ${{ secrets.API_ENV_FILE }}
          FRONTEND_ENV_FILE: ${{ secrets.FRONTEND_ENV_FILE }}